name: Aggiorna proposte circolari pubbliche TEST
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-circolari-pubbliche-test
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Librerie pubbliche
        run: python -m pip install requests beautifulsoup4 pymupdf
      - name: Verifica sintassi e regole di estrazione
        run: |
          python -m compileall -q scripts
          python scripts/test_riunioni_generali.py
      - name: Rileva nuove convocazioni pubbliche
        run: python scripts/aggiorna_proposte_pubbliche.py
      - name: Pubblica soltanto il JSON delle proposte
        shell: bash
        run: |
          if git diff --quiet -- data/proposte-circolari.json; then
            echo "Nessuna nuova proposta."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proposte-circolari.json
          git commit -m "Aggiorna proposte pubbliche da approvare (TEST)"
          git push
