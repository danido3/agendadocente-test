name: Diagnostica circolari pubbliche 2026-2027
on:
  workflow_dispatch:
  push:
    branches: ['codex/diagnostica-circolari-2026']
    paths:
      - 'scripts/diagnostica_circolari.py'
      - 'scripts/test_diagnostica_circolari.py'
      - '.github/workflows/diagnostica-circolari.yml'
permissions:
  contents: read
concurrency:
  group: diagnostica-circolari-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostica:
    if: github.repository == 'danido3/agendadocente-test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 pymupdf==1.26.7
      - name: Test diagnostica
        run: python -m unittest discover -s scripts -p 'test_diagnostica_circolari.py'
      - name: Analisi archivio pubblico (nessuna scrittura agenda)
        run: python scripts/diagnostica_circolari.py
      - name: Report JSON e Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostica-circolari-2026-2027
          path: |
            diagnostica-output/report.json
            diagnostica-output/report.md
          if-no-files-found: error
          retention-days: 7
