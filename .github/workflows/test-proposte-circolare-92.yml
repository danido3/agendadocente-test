name: TEST proposte circolare 92
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genera-proposte:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa librerie
        run: python -m pip install requests beautifulsoup4 pymupdf
      - name: Genera proposte da verificare
        run: python scripts/proposte_circolare_92.py
      - name: Salva risultati del test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposte-circolare-92
          path: proposte_circolare_92_test.json
          if-no-files-found: ignore
          retention-days: 3
