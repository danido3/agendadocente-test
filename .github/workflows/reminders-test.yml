name: Agenda IPIA TEST - promemoria
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulazione senza inviare notifiche'
        type: boolean
        default: true
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: agenda-ipia-test-reminders
  cancel-in-progress: false
jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa dipendenze
        run: npm install --no-audit --no-fund --no-save firebase-admin@13 luxon@3
      - name: Controlla e invia promemoria
        env:
          ACTIONS_REMINDERS_ENABLED: ${{ secrets.ACTIONS_REMINDERS_ENABLED }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node scripts/send-reminders.mjs
