name: TEST PDF circolare 92
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leggi-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa librerie
        run: python -m pip install requests beautifulsoup4 pymupdf
      - name: Esamina PDF circolare 92
        run: python scripts/test_pdf_circolare_92.py
      - name: Salva risultato anche in caso di esito negativo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-circolare-92
          path: test_circolare_92.json
          if-no-files-found: ignore
          retention-days: 3
